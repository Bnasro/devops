version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: nasr_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nasr
    volumes:
      - mongodb_data:/data/db
    networks:
      - nasr_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/nasr --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Node.js + Express)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nasr_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: sh -c "npm run seed:db admin@example.com admin123 && npm start"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/nasr
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - nasr_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  nasr_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local

